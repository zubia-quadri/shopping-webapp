<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Master Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6" />
      <stop offset="35%" stop-color="#F2F8F6" />
      <stop offset="70%" stop-color="#EDF5F3" />
      <stop offset="100%" stop-color="#F7FAF9" />
    </linearGradient>

    <!-- Translucent Teal Ribbon Gradient 1 -->
    <linearGradient id="tealWaveGrad1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0E544A" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#147B6D" stop-opacity="0.035" />
      <stop offset="100%" stop-color="#0E544A" stop-opacity="0.01" />
    </linearGradient>

    <!-- Translucent Teal Ribbon Gradient 2 -->
    <linearGradient id="tealWaveGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0E544A" stop-opacity="0.045" />
      <stop offset="60%" stop-color="#16897A" stop-opacity="0.025" />
      <stop offset="100%" stop-color="#FAF9F6" stop-opacity="0" />
    </linearGradient>

    <!-- Champagne Gold Ambient Light Ray -->
    <linearGradient id="goldRayGrad" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.045" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Deep Water Light Glow Radial -->
    <radialGradient id="ambientGlow1" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#0E544A" stop-opacity="0.06" />
      <stop offset="40%" stop-color="#0E544A" stop-opacity="0.025" />
      <stop offset="100%" stop-color="#0E544A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientGlow2" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#C5A059" stop-opacity="0.015" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="causticCenter" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#147B6D" stop-opacity="0.035" />
      <stop offset="60%" stop-color="#FAF9F6" stop-opacity="0" />
    </radialGradient>

    <!-- Blur filter for ethereal caustics -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="heavyBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- 1. Base Canvas -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- 2. Soft Ambient Luminous Blobs (High-key ethereal light) -->
  <circle cx="350" cy="280" r="500" fill="url(#ambientGlow1)" filter="url(#heavyBlur)" />
  <circle cx="1650" cy="850" r="600" fill="url(#ambientGlow2)" filter="url(#heavyBlur)" />
  <circle cx="960" cy="540" r="550" fill="url(#causticCenter)" filter="url(#heavyBlur)" />

  <!-- 3. Elegant Translucent Fluid Water Waves & Ribbons -->
  <!-- Wave 1: Flowing from bottom left to top right -->
  <path d="M-100 850 C300 750, 600 950, 1050 780 C1500 610, 1800 680, 2050 520 L2050 1150 L-100 1150 Z" 
        fill="url(#tealWaveGrad1)" />

  <!-- Wave 2: Upper ethereal crest -->
  <path d="M-50 200 C450 120, 800 380, 1250 240 C1650 120, 1850 260, 2000 150 L2000 -50 L-50 -50 Z" 
        fill="url(#tealWaveGrad2)" />

  <!-- Wave 3: Subtle diagonal light ribbon -->
  <path d="M-100 620 C420 540, 780 720, 1220 580 C1620 440, 1880 500, 2050 410 L2050 750 C1820 820, 1500 760, 1150 880 C750 1010, 320 890, -100 980 Z" 
        fill="url(#goldRayGrad)" 
        filter="url(#softBlur)" />

  <!-- 4. Delicate Purity Concentric Water Wave Rings (Minimal & Faint) -->
  <g opacity="0.45" stroke="#0E544A" stroke-width="0.8" fill="none">
    <ellipse cx="280" cy="380" rx="220" ry="90" stroke-opacity="0.08" stroke-dasharray="4 8" />
    <ellipse cx="280" cy="380" rx="360" ry="150" stroke-opacity="0.06" />
    <ellipse cx="280" cy="380" rx="520" ry="210" stroke-opacity="0.035" stroke-dasharray="6 12" />
  </g>

  <g opacity="0.4" stroke="#C5A059" stroke-width="0.8" fill="none">
    <ellipse cx="1680" cy="720" rx="260" ry="110" stroke-opacity="0.08" stroke-dasharray="5 10" />
    <ellipse cx="1680" cy="720" rx="420" ry="180" stroke-opacity="0.05" />
    <ellipse cx="1680" cy="720" rx="600" ry="250" stroke-opacity="0.03" />
  </g>

  <!-- 5. Micro Water Crystal Sparkle accents (Whisper subtle) -->
  <g opacity="0.35" fill="#0E544A">
    <circle cx="480" cy="220" r="1.5" />
    <circle cx="820" cy="160" r="1.2" opacity="0.6" />
    <circle cx="1340" cy="290" r="1.8" opacity="0.5" />
    <circle cx="1580" cy="460" r="1.2" opacity="0.7" />
    <circle cx="340" cy="680" r="1.5" opacity="0.5" />
    <circle cx="760" cy="840" r="1.8" opacity="0.6" />
    <circle cx="1180" cy="910" r="1.4" opacity="0.4" />
  </g>

  <g opacity="0.35" fill="#C5A059">
    <circle cx="620" cy="340" r="1.4" />
    <circle cx="1450" cy="210" r="1.6" />
    <circle cx="1720" cy="520" r="1.2" />
    <circle cx="920" cy="780" r="1.5" />
  </g>
</svg>
